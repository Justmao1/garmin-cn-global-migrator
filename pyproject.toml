[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-cn-global-migrator"
version = "1.0.0"
description = "Full-fidelity migration and sync tool between Garmin China (garmin.cn) and Garmin Global (garmin.com) for activities, metadata, 24/7 wellness, 12-metric body composition, gear, and workouts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "garminconnect>=0.3.0",
    "curl_cffi>=0.7.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
garmin-migrate = "migrate:main"

[tool.setuptools]
py-modules = ["migrate"]
packages = ["garmin_migrator", "garmin_migrator.migrators", "garminconnect", "garminconnect.api", "garminconnect.client"]
